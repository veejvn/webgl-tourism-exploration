        - generic [ref=f1e551]: "Hãy đi để đến tham quan du lịch khám phá và trải nghiệm: ☘️ KDL Sinh Thái Cồn Én: địa chỉ ấp Tấn Long, xã Tấn Mỹ, huyện Chợ Mới, tỉnh An Giang cách TP Long Xuyên 20km, cách TP Châu Đốc 75km cách TP Cao Lãnh 22km với các dịch vụ tham quan giải trí và trải nghiệm như sau: - Khu trưng bày các tác phẩm điêu khắc bằng Gỗ lũa độc lạ: Bức tranh gổ lũa 1 thân dài 24.5m bức tranh quê hương, tượng rồng khổng lồ và nhiều tác phẩm nghệ thuật thật ấn tượng. - Khu trưng bày bộ sưu tập xe biển số đẹp độc đáo: hơn 500 xe biển số đẹp được chủ đầu tư cất công sưu tầm hơn 20 năm đến từ nhiều thương hiệu khác nhau. Gồm nhiều dòng xe máy và xe ô tô cổ mỗi xe là một biên bản độc nhất. - Vườn cây cảnh bonsai nghệ thuật dừa bonsai, mai chiếu thủy cùng bộ sưu tập cây kiểng độc lạ - Du thuyền 3 tầng với chất liệu Gỗ lũa độc đáo có 1 Không 2 - Đặc biệt là khu Tum với kiến trúc độc đáo không chạm đất thiết kế phục vụ ẩm thực hoàn toàn bằng gỗ lũa mang tên 13 tỉnh Đồng Bằng Sông Cửu Long - Đài quan sát cao 26m ngắm nhìn toàn cảnh Cồn Én và sông Tiền nằm giữa quảng trường 1) 4 khu vực để quý khách trải nghiệm: 2) Khu vực hồ trò chơi nhân gian hơn 10 trò chơi nước: Cầu lắc, cầu trượt, cầu phao, vượt chướng ngại vật, zipline, chèo xuồng, chèo sup, leo núi ,.. 3) Khu vực trò chơi khô : Xích đu, zipline, đạp xe lửa, bập bênh ... 4) Khu vực trải nghiệm độc lạ tắm cồn và tham gia các trò chơi trên cát theo phong cách tắm biển duy nhất tại miền tây. 5) Khu vực trải nghiệm trên sông bằng du thuyền phà gỗ mang đến cho du khách trải nghiệm lênh đênh giữa lòng sông ngắm nhìn cảnh sinh hoạt người dân sống trên xứ cồn, những ngôi ven nhà trên sông Mekong, ăn trưa trên thuyền, ngoài ra kết hợp thêm trải nghiệm các dịch vụ như bắt cá, chài cá, dỡ lưới, dỡ chà ... - khu vực phục vụ nhà hàng ẩm thực gồm: phòng VIP, các tum không chạm đất cạnh bờ sông, sảnh chính của nhà hàng,... Cùng đội ngũ bếp chuyên nghiệp phục vụ đầy đủ các hình thức tiệc Gala – Tiệc cưới - Teambuilding theo yêu cầu của quý khách. - Dự kiến Resort Nghỉ dưỡng vào tháng 9 /2024 đưa vào phục vụ với hơn 18 căn Bungalow được xây dựng với kiến trúc độc đáo hài hòa trên cây lạ mắt và hòa cùng không gian xanh mát. Với triết lý sống xanh, Cồn Én Resort là khu nghỉ dưỡng lí tưởng dành cho du khách trong nước và quốc tế tận hưởng trọn vẹn du lịch nghỉ dưỡng đẳng cấp, kết hợp khám phá Khu du lịch sinh thái Cồn Én. ☘️ Khu du lịch sinh thái Mỹ Luông: địa chỉ: ĐT 942 Ấp Mỹ Hòa, Xã Mỹ Luông, huyện Chợ Mới, tỉnh An Giang Như những lời đồn thổi lâu nay, khu du lịch có không gian độc – lạ – hấp dẫn, được thiết kế với nhiều khu vực riêng biệt như sau: Khu check in, sống ảo dành cho du khách muốn tham quan, chụp ảnh với nhiều tiểu cảnh đẹp. Nơi đây còn tái hiện lại khung cảnh một làng quê nghèo yên ả là điểm nhấn chiếm trọn trái tim của nhiều du khách. 1. Khu sưu tập xe máy hơn 500 chiếc với nhiều biển số đẹp mà ai cũng ao ước. 2. Khu trưng bày các vật phẩm xưa độc nhất 3. Khu du lịch sinh thái Mỹ Luông sở hữu không gian sinh thái vô cùng đặc sắc, Checkin hơn 100 kiểu ảnh đẹp với Nghinh Xuân các, Tháp Eiffel điện gió, Cây Đàn Guitar, Vườn bonsai hoa lan các loại, ao Sen, bàn tay gỗ, nất thang thiên đường ..v..v. 4. Khu bày trí các tác phẩm nghệ thuật điêu khắc gỗ lũa như: Quan Âm Bồ Tát, Thích Ca, 12 con giáp,… cực kì tinh xảo 5. Khu tổ chức các sự kiện lớn nhỏ ngoài trời và trong nhà theo nhu cầu của du khách 6. Khu nhà hàng – cafe với thiết kế đơn sơ, mộc mạc phục vụ các món ăn đồng quê địa phương và cơm đoàn. 7. Khu trưng bày các mặt hàng lưu niệm cho khách cho nhu cầu mua làm quà ... ☘️ Khu du lịch sinh thái An Khang Thanh Bình - Đồng Tháp: địa chỉ: Khóm tân Thuận, thị Trấn Thanh Bình, Huyện Cao Lãnh, tỉnh Đồng Tháp. Đến đây du khách tham quan du lịch nông nghiệp như: vườn nho thân gỗ, vườn cây ăn trái theo mùa, vườn rau sạch hưu cơ, vườn cây Bonsai độc lạ và thưởng thức ẩm thực hoàn toàn tự nhiên."
