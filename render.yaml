services:
  - type: web
    name: webgl-tourism-api
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter api exec prisma generate && pnpm --filter api... build
    startCommand: pnpm --filter api start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://webgl-tourism-exploration-hoangveworkspace-gmailcoms-projects.vercel.app
